[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filing-downloader"
version = "0.1.0"
description = "MCP server for downloading financial filings from HKEX and CNINFO"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
]

[project.scripts]
filing-downloader = "filing_downloader.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filing_downloader"]
